<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Antena -->
  <line x1="50" y1="20" x2="50" y2="6" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="6" r="5" fill="#ffcc00"/>
  
  <!-- Cabeza -->
  <rect x="24" y="20" width="52" height="34" rx="8" fill="#455a64" stroke="#263238" stroke-width="3"/>
  
  <!-- Orejas/Pernos -->
  <rect x="17" y="30" width="7" height="14" rx="2" fill="#00bcd4"/>
  <rect x="76" y="30" width="7" height="14" rx="2" fill="#00bcd4"/>
  
  <!-- Visor oscuro -->
  <rect x="30" y="28" width="40" height="16" rx="4" fill="#1a237e"/>
